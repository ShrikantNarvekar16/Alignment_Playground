output_dir: "checkpoints/sft"

dataset_path: "data/processed/sft_train.jsonl"
val_dataset_path: "data/processed/sft_val.jsonl"

# ============================================================
# LoRA
# ============================================================

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

lora_target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"

# ============================================================
# Training
# ============================================================

num_train_epochs: 2

per_device_train_batch_size: 1
per_device_eval_batch_size: 1

gradient_accumulation_steps: 8
gradient_checkpointing: true

learning_rate: 2.0e-4
lr_scheduler_type: "cosine"

# TRL 1.12.0 SFTConfig does NOT accept warmup_ratio.
# Use warmup_steps instead.
warmup_steps: 0

weight_decay: 0.01
optim: "paged_adamw_8bit"
max_grad_norm: 0.3

# ============================================================
# Logging / Evaluation
# ============================================================

logging_steps: 10

eval_steps: 100

save_steps: 200
save_total_limit: 2

# ============================================================
# Reproducibility / Precision
# ============================================================

seed: 42

bf16: true

report_to: "tensorboard"